# clamd for the local stack (core L4b). Mounted read-only over the image default; the
# image default plus stream and scan limits above the seal worker's 256 MiB inline limit.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
StreamMaxLength 300M
MaxScanSize 300M
MaxFileSize 300M
