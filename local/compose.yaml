# Local SDP stack (core rung R1 dependencies, infra phase I1).
# Everything is namespaced by environment: project sdp-<env>, <service>-<env> containers,
# sdp-<env>-net network, sdp-<env>-<service> volumes. Ports bind to 127.0.0.1 only.
# Run through the Makefile (make deps-up), which supplies --env-file local/.env.<env>.
name: sdp-${SDP_ENV:?run make deps-up}

services:
  postgres:
    container_name: postgres-${SDP_ENV}
    # pgvector 0.8.2 on PostgreSQL 17, pinned by digest.
    image: pgvector/pgvector:0.8.2-pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    profiles: [deps]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${SDP_PG_PORT:-55432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      sdp.env: ${SDP_ENV}

  azurite:
    container_name: azurite-${SDP_ENV}
    # Azurite 3.35.0, pinned by digest. Blob service only; accounts from AZURITE_ACCOUNTS.
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    profiles: [deps]
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--skipApiVersionCheck"]
    environment:
      AZURITE_ACCOUNTS: ${AZURITE_ACCOUNTS}
    ports:
      - "127.0.0.1:${SDP_BLOB_PORT:-10100}:10000"
    volumes:
      - azurite:/data
    networks: [net]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      sdp.env: ${SDP_ENV}

  lgtm:
    container_name: lgtm-${SDP_ENV}
    # grafana/otel-lgtm 0.11.10, pinned by digest: OTel collector, Prometheus, Loki, Tempo, Grafana.
    image: grafana/otel-lgtm:0.11.10@sha256:09d8c3ce4f3a5f2f5b1ef7a3cc526a7e03b608aeef3ea1c67c912df43b2690c9
    profiles: [deps]
    # OTLP is reached only through otelcol (ADR 0009); only Grafana is published.
    ports:
      - "127.0.0.1:${SDP_GRAFANA_PORT:-13000}:3000"
    volumes:
      - lgtm:/data
    networks: [net]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
    labels:
      sdp.env: ${SDP_ENV}

  otelcol:
    container_name: otelcol-${SDP_ENV}
    # OpenTelemetry Collector contrib 0.165.0, pinned by digest. Config shared with I3d and I4.
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    profiles: [deps]
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      LGTM_OTLP_ENDPOINT: lgtm-${SDP_ENV}:4317
    ports:
      - "127.0.0.1:${SDP_OTLP_GRPC_PORT:-14317}:4317"
      - "127.0.0.1:${SDP_OTLP_HTTP_PORT:-14318}:4318"
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    networks: [net]
    depends_on:
      lgtm: { condition: service_healthy }
    labels:
      sdp.env: ${SDP_ENV}

  keycloak:
    container_name: keycloak-${SDP_ENV}
    # Keycloak 26.4.7, pinned by digest. Dev mode (embedded H2 in the volume); realms come from
    # terraform/envs/dev (make idp-apply), never from a realm import.
    image: quay.io/keycloak/keycloak:26.4@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    profiles: [deps]
    # Containers discover through keycloak-<env>:8080, so backend endpoints (jwks_uri, token)
    # follow the request host; the issuer stays the public URL that tokens carry.
    command: ["start-dev", "--http-port=8080", "--health-enabled=true",
              "--hostname=http://127.0.0.1:${SDP_KEYCLOAK_PORT:-18180}", "--hostname-backchannel-dynamic=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run make deps-env}
    ports:
      - "127.0.0.1:${SDP_KEYCLOAK_PORT:-18180}:8080"
    volumes:
      - keycloak:/opt/keycloak/data
    networks: [net]
    healthcheck:
      # No curl in the image; probe the management port's readiness endpoint over bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 60
    labels:
      sdp.env: ${SDP_ENV}

  lowkey-vault:
    container_name: lowkey-vault-${SDP_ENV}
    # Lowkey Vault 7.1.32 (Key Vault API emulator), pinned by digest. Holds dev signing keys only.
    image: nagyesta/lowkey-vault:7.1.32@sha256:281cf30611fc314de18d30894d1bc3d3100ffbf02039a11a1d7e8c4a4952e59d
    profiles: [deps]
    environment:
      LOWKEY_ARGS: "--server.port=8443 --LOWKEY_VAULT_NAMES=sdp-${SDP_ENV}"
    ports:
      - "127.0.0.1:${SDP_KEYVAULT_PORT:-18443}:8443"
    networks: [net]
    labels:
      sdp.env: ${SDP_ENV}

  clamav:
    container_name: clamav-${SDP_ENV}
    # ClamAV 1.5.5 (multi-arch debian build), pinned by digest. clamd on 3310, network-internal only;
    # signatures persist in the volume so restarts skip the full download.
    image: clamav/clamav-debian:stable@sha256:cb2b6fa0bf480a3c243117204b751f062c5350569d088dc269ebeef6b4331823
    profiles: [deps]
    volumes:
      - clamav:/var/lib/clamav
    networks: [net]
    labels:
      sdp.env: ${SDP_ENV}

  # ---- app profile (I2, core rung R2): core's images; env files from core's make app-env.
  migrate-bootstrap:
    container_name: migrate-bootstrap-${SDP_ENV}
    image: ${LOCKER_IMAGE:-sdp-dev/locker:local}
    profiles: [app]
    entrypoint: ["/usr/local/bin/migrate", "bootstrap"]
    env_file: ${SDP_APP_ENV_DIR:-../../newco-sdp-core}/.env.app.${SDP_ENV}.migrate
    networks: [net]
    restart: "no"
    labels:
      sdp.env: ${SDP_ENV}

  migrate:
    container_name: migrate-${SDP_ENV}
    image: ${LOCKER_IMAGE:-sdp-dev/locker:local}
    profiles: [app]
    entrypoint: ["/usr/local/bin/migrate", "up"]
    env_file: ${SDP_APP_ENV_DIR:-../../newco-sdp-core}/.env.app.${SDP_ENV}.migrate
    networks: [net]
    restart: "no"
    depends_on:
      migrate-bootstrap: { condition: service_completed_successfully }
    labels:
      sdp.env: ${SDP_ENV}

  locker:
    container_name: locker-${SDP_ENV}
    image: ${LOCKER_IMAGE:-sdp-dev/locker:local}
    profiles: [app]
    env_file: ${SDP_APP_ENV_DIR:-../../newco-sdp-core}/.env.app.${SDP_ENV}.locker
    ports:
      - "127.0.0.1:${SDP_LOCKER_GRPC_PORT:-18080}:18080"
      - "127.0.0.1:${SDP_LOCKER_HTTP_PORT:-18081}:18081"
    networks: [net]
    depends_on:
      migrate: { condition: service_completed_successfully }
    labels:
      sdp.env: ${SDP_ENV}

  seal-worker:
    container_name: seal-worker-${SDP_ENV}
    image: ${SEAL_WORKER_IMAGE:-sdp-dev/seal-worker:local}
    profiles: [app]
    env_file: ${SDP_APP_ENV_DIR:-../../newco-sdp-core}/.env.app.${SDP_ENV}.seal-worker
    ports:
      - "127.0.0.1:${SDP_SEAL_WORKER_PORT:-18091}:18091"
    networks: [net]
    depends_on:
      migrate: { condition: service_completed_successfully }
    labels:
      sdp.env: ${SDP_ENV}

networks:
  net:
    name: sdp-${SDP_ENV}-net

volumes:
  postgres:
    name: sdp-${SDP_ENV}-postgres
  azurite:
    name: sdp-${SDP_ENV}-azurite
  lgtm:
    name: sdp-${SDP_ENV}-lgtm
  keycloak:
    name: sdp-${SDP_ENV}-keycloak
  clamav:
    name: sdp-${SDP_ENV}-clamav
