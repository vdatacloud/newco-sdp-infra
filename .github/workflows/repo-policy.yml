# Shared by every SDP repo; the source is newco-sdp-core. Edit it there, then copy it over unchanged.
#
# Signed commits: every commit in a PR must be Verified on GitHub and carry Signed-off-by (merge commits are
# exempt from the sign-off). Shared files: outside core, the files below must match core's main. Core is
# private, so that job reads it with CORE_READ_TOKEN (Contents: read on newco-sdp-core only); without the
# secret it warns and passes.
name: repo-policy

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  signed-commits:
    name: Signed commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check every commit in the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/pulls/${PR}/commits" \
            --jq '.[] | [.sha[0:12], (.commit.verification.verified|tostring), (.parents|length|tostring),
                  ((.commit.message|test("(?m)^Signed-off-by: "))|tostring)] | @tsv' > commits.tsv
          bad=0
          while IFS=$'\t' read -r sha verified parents signedoff; do
            if [ "$verified" != "true" ]; then
              echo "::error::${sha} is not Verified: sign commits (commit.gpgsign=true, key registered on GitHub)."; bad=1
            fi
            if [ "$parents" = "1" ] && [ "$signedoff" != "true" ]; then
              echo "::error::${sha} has no Signed-off-by: commit with -s."; bad=1
            fi
          done < commits.tsv
          echo "$(wc -l < commits.tsv) commit(s) checked."
          exit $bad

  shared-files:
    name: Shared files
    if: github.repository != 'vdatacloud/newco-sdp-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare with newco-sdp-core main
        env:
          CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CORE_READ_TOKEN}" ]; then
            echo "::warning::CORE_READ_TOKEN is not set; skipping the shared-files check."
            exit 0
          fi
          bad=0
          for f in docs/REPOSITORIES.md .claude/skills/github-ci/SKILL.md \
                   .github/pull_request_template.md .github/workflows/repo-policy.yml; do
            curl -fsSL -H "Authorization: Bearer ${CORE_READ_TOKEN}" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/vdatacloud/newco-sdp-core/contents/${f}?ref=main" -o core.tmp
            if ! diff -u core.tmp "$f"; then
              echo "::error file=${f}::Out of date with newco-sdp-core. Copy core's ${f} over this file unchanged."
              bad=1
            fi
          done
          [ "$bad" = 0 ] && echo "Shared files match newco-sdp-core main."
          exit $bad
